# Categories for GitHub's auto-generated release notes ("Generate release notes").
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: CI and build
      labels: [ci, build]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
