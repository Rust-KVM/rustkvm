name: Labeler

# Labels pull requests by the paths they touch (.github/labeler.yml).
# pull_request_target runs with the base branch's workflow and config and never
# checks out the PR's code, so it is safe for PRs from forks.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    name: label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: false
