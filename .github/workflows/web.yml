name: Web

on:
  push:
    branches: [main, dev]
    paths:
      - "crates/rkvm-web/**"
      - "crates/rkvm-proto/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "crates/rkvm-web/**"
      - "crates/rkvm-proto/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: crates/rkvm-web
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fmt
    defaults:
      run:
        working-directory: crates/rkvm-web
    steps:
      - uses: actions/checkout@v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rkvm-web -> target
      - name: Clippy
        run: cargo clippy --locked --all-targets --target wasm32-unknown-unknown -- -D warnings

  build:
    name: trunk build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fmt
    defaults:
      run:
        working-directory: crates/rkvm-web
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rkvm-web -> target
      - name: Install trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: "v0.21.14"
      - name: Build
        run: trunk build --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/rkvm-web/Cargo.toml
          arguments: --all-features

  web-ci-success:
    name: Web CI Success
    runs-on: ubuntu-latest
    needs: [fmt, clippy, build, deny]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ needs.fmt.result }}"    != "success" || \
                "${{ needs.clippy.result }}" != "success" || \
                "${{ needs.build.result }}"  != "success" || \
                "${{ needs.deny.result }}"   != "success" ]]; then
            echo "::error::One or more web CI jobs failed"
            exit 1
          fi
          echo "All web CI jobs passed."
