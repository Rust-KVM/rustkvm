name: Labels

# Keeps repository labels in sync with .github/labels.yml.
on:
  push:
    branches: [dev]
    paths: [".github/labels.yml", ".github/workflows/labels.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
