name: RK3588 buildkit

# Builds the FriendlyELEC/Rockchip Buildroot SDK once, publishes its host
# toolchain + sysroot (the /opt/rk3588-buildkit that .cargo/config.toml expects)
# as a container image for release.yml, and keeps the system images it produced.

on:
  workflow_dispatch:
    inputs:
      sdk_source:
        description: Google Drive file ID/link of buildroot-rk3588-<sdk_tag>.tar, or a OneDrive shared-folder link containing it
        required: true
      sdk_tag:
        description: Image tag, usually the SDK date
        required: true
        default: "20250527"

permissions:
  contents: read
  packages: write

env:
  # Image references must be lowercase; the owner login is "Rust-KVM".
  IMAGE: ghcr.io/rust-kvm/rk3588-buildkit

jobs:
  buildkit:
    name: build SDK + publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      # Buildroot needs far more than the runner's default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gcc-arm-linux-gnueabihf clang llvm-dev libclang-dev unzip \
            build-essential zstd device-tree-compiler gperf libnl-3-dev libdbus-1-dev \
            libelf-dev libmpc-dev dwarves bc openssl flex bison libssl-dev python3 \
            python-is-python3 texinfo kmod cmake rsync cpio file wget pipx
      - name: Download SDK
        env:
          SDK_SOURCE: ${{ inputs.sdk_source }}
          SDK_NAME: buildroot-rk3588-${{ inputs.sdk_tag }}.tar
        run: |
          python3 ci/buildkit/fetch_sdk.py "$SDK_SOURCE" "$SDK_NAME" "$RUNNER_TEMP/sdk.tar"
          ls -lh "$RUNNER_TEMP/sdk.tar"
      # FriendlyELEC ships the SDK as a top-level directory holding only a
      # .repo mirror; `repo sync -l` checks the sources out without network.
      - name: Unpack SDK
        working-directory: ${{ runner.temp }}
        run: |
          mkdir sdk
          tar -xf sdk.tar -C sdk
          rm sdk.tar
          marker=$(find sdk -maxdepth 2 -name .repo -print -quit)
          marker=${marker:-$(find sdk -maxdepth 2 -name build.sh -print -quit)}
          test -n "$marker"
          root=$(dirname "$marker")
          cd "$root"
          ls -la
          if [ ! -e build.sh ]; then
            .repo/repo/repo sync -l --no-clone-bundle
          fi
          echo "SDK_DIR=$PWD" >> "$GITHUB_ENV"
          df -h /
      - name: Build Buildroot
        working-directory: ${{ env.SDK_DIR }}
        run: ./build.sh rk3588.mk
      - name: Stage toolchain
        run: |
          host="$SDK_DIR/buildroot/output/rockchip_rk3588/host"
          test -x "$host/bin/aarch64-buildroot-linux-gnu-gcc"
          cp -a "$host" ci/buildkit/rk3588-buildkit
      - name: Upload system images
        uses: actions/upload-artifact@v4
        with:
          name: rk3588-system-images-${{ inputs.sdk_tag }}
          path: |
            ${{ env.SDK_DIR }}/buildroot/output/rockchip_rk3588/images/
            ${{ env.SDK_DIR }}/rockdev/
          if-no-files-found: warn
          retention-days: 30
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ci/buildkit
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.sdk_tag }}
            ${{ env.IMAGE }}:latest
