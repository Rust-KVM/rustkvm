# Repository labels, synced by .github/workflows/labels.yml.
# Labels not listed here are left alone (skip-delete).

- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: question
  color: d876e3
  description: Further information is requested
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists
- name: wontfix
  color: ffffff
  description: This will not be worked on
- name: breaking
  color: b60205
  description: Changes behaviour or an API in an incompatible way
- name: security
  color: ee0701
  description: Security hardening or a security fix
- name: skip-changelog
  color: eeeeee
  description: Leave out of generated release notes

- name: dependencies
  color: "0366d6"
  description: Dependency updates
- name: rust
  color: dea584
  description: Rust code or Cargo changes
- name: github-actions
  color: "000000"
  description: GitHub Actions updates
- name: ci
  color: fbca04
  description: CI workflows and checks
- name: build
  color: c5def5
  description: Toolchain, cross-compilation and packaging

- name: "area: video"
  color: 1d76db
  description: GStreamer, MPP encoding, WebRTC media
- name: "area: hid"
  color: 1d76db
  description: Keyboard, mouse, HID-RPC
- name: "area: usb"
  color: 1d76db
  description: USB gadget and virtual media
- name: "area: power"
  color: 1d76db
  description: ATX, DC power, Wake-on-LAN
- name: "area: api"
  color: 1d76db
  description: JSON-RPC, HTTP routes, MCP, MQTT
- name: "area: network"
  color: 1d76db
  description: Network config, mDNS, TLS, Tailscale, cloud
- name: rkvm-web
  color: 5319e7
  description: Leptos / WASM frontend
- name: rkvm-proto
  color: 5319e7
  description: Shared protocol crate
