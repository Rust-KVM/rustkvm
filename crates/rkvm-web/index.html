<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>rustkvm</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='14' height='10' rx='2' fill='%23c6613f'/%3E%3Crect x='5' y='13' width='6' height='1.5' rx='.75' fill='%23c6613f'/%3E%3C/svg%3E" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
      window.rkvmOcr = async function (canvas) {
        if (typeof Tesseract === "undefined") throw new Error("OCR engine not loaded");
        const { data } = await Tesseract.recognize(canvas, "eng");
        return data.text;
      };
    </script>
    <link data-trunk rel="css" href="style/tokens.css" />
    <link data-trunk rel="css" href="style/base.css" />
    <link data-trunk rel="css" href="style/components.css" />
    <link data-trunk rel="css" href="style/shell.css" />
    <link data-trunk rel="css" href="style/panels.css" />
    <script>
      // Apply the theme before first paint: the saved choice, else the OS one.
      // src/theme.rs owns changes after load and uses the same storage key.
      (function () {
        var root = document.documentElement, saved = null;
        try { saved = localStorage.getItem("rkvm.theme"); } catch (e) {}
        var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          var t = root.dataset.themeChoice || (mq && mq.matches ? "dark" : "light");
          root.dataset.theme = t;
        };
        if (saved === "light" || saved === "dark") root.dataset.themeChoice = saved;
        apply();
        if (mq && mq.addEventListener) mq.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body></body>
</html>
